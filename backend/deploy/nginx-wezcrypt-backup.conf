# Include INSIDE the existing `server { server_name studio.rextv.sbs; listen 443 ssl; ... }` block.
# Only /api/v2/ is new; all existing locations (studio, bot webhooks, /api/files ...) stay untouched.
location ^~ /api/v2/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 34m;          # 32 MiB max chunk + headroom
    proxy_request_buffering off;       # stream chunks to disk in the API
    proxy_buffering off;               # stream downloads
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
