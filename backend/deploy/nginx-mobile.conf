# Include inside the existing `server { server_name studio.rextv.sbs; ... }` block (TLS already configured).
# Only /api/mobile/ is routed to the new service; every existing location stays untouched.

location ^~ /api/mobile/internal/ {
    deny all;               # bot <-> API traffic uses 127.0.0.1:8090 directly
}

location ^~ /api/mobile/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 9m;        # 8 MiB chunk + headroom; matches WZC_MOBILE_CHUNK_SEGMENTS=8
    proxy_request_buffering off;     # stream chunks straight to the API
    proxy_buffering off;             # stream video ranges
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
