[project]
name = "wezcrypt-mobile"
version = "1.0.0"
description = "WezCrypt Secure Studio native iOS app API (additive to the Telegram studio)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wezcrypt_mobile*"]

[tool.setuptools.package-data]
wezcrypt_mobile = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
