name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["ios/**", "backend/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release with the IPA"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: ios/WezCryptSecureStudio.xcodeproj
  SCHEME: WezCryptSecureStudio
  BUNDLE_ID: com.wezcrypt.securestudio

jobs:
  test:
    name: Tests (simulator + real backend)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"
          plutil -lint ios/WezCryptSecureStudio/Resources/Info.plist ios/WezCryptSecureStudio/Resources/WezCryptSecureStudio.entitlements

      - name: Start backend (localhost)
        run: |
          python -m pip install --quiet -r backend/requirements-dev.txt
          export WZC_BACKUP_STORAGE_ROOT="$RUNNER_TEMP/iphone-backups" WZC_BACKUP_STATE_DIR="$RUNNER_TEMP/state" WZC_BACKUP_MIN_FREE_BYTES=0
          export WZC_BACKUP_TOKEN_PEPPER_FILE="$RUNNER_TEMP/pepper"
          cd backend
          python -m wezcrypt_backup generate-pepper "$WZC_BACKUP_TOKEN_PEPPER_FILE"
          python -m wezcrypt_backup migrate
          PASSWORD="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "$PASSWORD" | python -m wezcrypt_backup create-user ci --password-stdin
          KEY=$(python -m wezcrypt_backup create-api-key ci --label ci | tail -1)
          echo "::add-mask::$KEY"
          echo "TEST_RUNNER_WZC_TEST_SERVER=http://127.0.0.1:8787" >> "$GITHUB_ENV"
          echo "TEST_RUNNER_WZC_TEST_USER=ci" >> "$GITHUB_ENV"
          echo "TEST_RUNNER_WZC_TEST_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_RUNNER_WZC_TEST_API_KEY=$KEY" >> "$GITHUB_ENV"
          nohup env WZC_BACKUP_STORAGE_ROOT="$WZC_BACKUP_STORAGE_ROOT" WZC_BACKUP_STATE_DIR="$WZC_BACKUP_STATE_DIR" \
            WZC_BACKUP_TOKEN_PEPPER_FILE="$WZC_BACKUP_TOKEN_PEPPER_FILE" WZC_BACKUP_MIN_FREE_BYTES=0 \
            python -m uvicorn wezcrypt_backup.standalone:app --host 127.0.0.1 --port 8787 --workers 1 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/v2/health && break; sleep 1; done

      - name: Boot simulator and grant Photos access
        id: sim
        timeout-minutes: 25
        run: |
          UDID=$(python3 ios/scripts/pick_simulator.py --verbose)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Hosted runners occasionally hang in bootstatus. Bound each attempt
          # (perl alarm: macOS has no coreutils timeout) and retry once from a
          # clean device before giving up.
          boot() {
            xcrun simctl boot "$UDID" 2>/dev/null || true
            perl -e 'alarm shift; exec @ARGV' 420 xcrun simctl bootstatus "$UDID" -b
          }
          if ! boot; then
            echo "::warning::Simulator boot timed out; erasing and retrying"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID"
            boot
          fi
          xcrun simctl privacy "$UDID" grant photos "$BUNDLE_ID" || true
          xcrun simctl privacy "$UDID" grant photos-add "$BUNDLE_ID" || true

      # Simulator builds are ad-hoc signed ("Sign to Run Locally"): without a
      # signature the app has no application-identifier entitlement and every
      # Keychain call fails with errSecMissingEntitlement (-34018).
      - name: Unit, integration and UI tests
        run: |
          set +e
          UDID="${{ steps.sim.outputs.udid }}"
          SIGN="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="
          # Build first, install the app and grant Photos access to the installed
          # bundle (a grant made before installation does not stick on recent
          # simulators), then run the already-built tests.
          xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -destination "id=$UDID" \
            -derivedDataPath build/dd $SIGN > xcodebuild-test.log 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            APP=$(find build/dd/Build/Products -maxdepth 2 -name "WezCryptSecureStudio.app" -path "*iphonesimulator*" | head -1)
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl privacy "$UDID" grant photos "$BUNDLE_ID" || echo "::warning::photos grant failed"
            xcrun simctl privacy "$UDID" grant photos-add "$BUNDLE_ID" || true
            xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -destination "id=$UDID" \
              -derivedDataPath build/dd -resultBundlePath TestResults.xcresult $SIGN >> xcodebuild-test.log 2>&1
            STATUS=$?
          fi
          set -e
          echo "::group::Compiler errors"; grep -E "error:" xcodebuild-test.log | sort -u | head -150; echo "::endgroup::"
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Test Case .*(passed|failed|skipped)" xcodebuild-test.log | sed -E 's/.*Test Case .-\[[A-Za-z]+\.([A-Za-z]+) ([A-Za-z0-9_]+)\]. (passed|failed|skipped).*/\3  \1.\2/' | sort | uniq | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ test" xcodebuild-test.log | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "\[benchmark\]" xcodebuild-test.log | sed 's/.*\[benchmark\]/[benchmark]/' | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
          grep -B2 -A8 -E "error: -\[|XCTAssert|failed \(" xcodebuild-test.log | head -200
          exit $STATUS

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild-test.log
            ${{ runner.temp }}/backend.log
          retention-days: 14

  ipa:
    name: Build IPA (unsigned, for external signing)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive for iOS devices (no signing)
        run: |
          if ! xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
              -destination "generic/platform=iOS" -archivePath build/WezCrypt.xcarchive \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > archive.log 2>&1; then
            grep -E "error:" archive.log | sort -u | head -100; tail -40 archive.log; exit 1
          fi
          tail -3 archive.log

      - name: Package and verify IPA
        id: package
        run: bash ios/scripts/package_ipa.sh build/WezCrypt.xcarchive dist "${{ github.run_number }}" "$BUNDLE_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WezCryptSecureStudio-ipa
          path: dist/*
          retention-days: 30

  release:
    name: Publish GitHub Release
    # The IPA's structure is verified by the ipa job; the release does not wait
    # for the simulator test job, whose result is linked in the release notes.
    needs: [ipa]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WezCryptSecureStudio-ipa
          path: dist
      - name: Re-verify downloaded IPA
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          IPA=$(ls *.ipa)
          unzip -tq "$IPA"
          unzip -Z1 "$IPA" | grep -Fxq "Payload/WezCryptSecureStudio.app/WezCryptSecureStudio"
          if unzip -Z1 "$IPA" | grep -Eq '(^__MACOSX/|/\._)'; then echo "macOS metadata in IPA"; exit 1; fi
      - name: Source archive
        run: git archive --format=zip -o dist/WezCryptSecureStudio-source.zip HEAD && (cd dist && sha256sum WezCryptSecureStudio-source.zip >> SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then TAG="build-${{ github.run_number }}"; fi
          IPA=$(cd dist && ls *.ipa)
          NOTES=$(printf '%s\n' \
            "Unsigned IPA for external signing (KravaSigner, Sideloadly, AltStore or Xcode). It cannot be installed until it is signed." \
            "" \
            "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}" \
            "Verify with SHA256SUMS.txt. Build details in BUILD-INFO.txt." \
            "Simulator test results for this commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "Installation guide: docs/INSTALLATION.md")
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "WezCrypt Secure Studio $TAG" --notes "$NOTES" --prerelease
